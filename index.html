<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="프로젝트 리더 겸 솔루션 아키텍트 @bbattery의 포트폴리오"
    />
    <title>@bbattery · Project Leader &amp; Solution Architect</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">본문으로 이동</a>

    <header class="site-header">
      <nav class="site-nav" aria-label="주요 메뉴">
        <a class="brand" href="#about">bbattery@portfolio:~$</a>
        <button
          id="menu-toggle"
          class="menu-toggle"
          type="button"
          aria-controls="site-menu"
          aria-expanded="false"
        >
          메뉴
        </button>
        <div id="site-menu" class="site-menu">
          <a href="#about">소개</a>
          <a href="#capabilities">역량</a>
          <a href="#tech-stack">기술</a>
          <a href="#projects">프로젝트</a>
          <a href="#career">경력</a>
        </div>
      </nav>
    </header>

    <main id="main-content">
      <section id="about" class="hero" aria-labelledby="hero-title">
        <p class="terminal-label">&gt; whoami</p>
        <p class="status">
          <span aria-hidden="true"></span>STATUS: BUILDING WHAT'S NEXT
        </p>
        <h1 id="hero-title"></h1>
        <p class="hero-role"></p>
        <p class="hero-summary"></p>
        <p class="hero-period"></p>

        <aside class="heart-monitor" aria-labelledby="heart-monitor-title">
          <div class="monitor-header">
            <p id="heart-monitor-title">LIVE VITALS</p>
            <span><i aria-hidden="true"></i>STABLE</span>
          </div>
          <svg
            viewBox="0 0 640 320"
            role="img"
            aria-label="심박수 그래프, 분당 72회"
          >
            <title>심박수 그래프, 72 BPM</title>
            <g class="heart-grid" aria-hidden="true">
              <line x1="0" y1="48" x2="640" y2="48" />
              <line x1="0" y1="112" x2="640" y2="112" />
              <line x1="0" y1="176" x2="640" y2="176" />
              <line x1="0" y1="240" x2="640" y2="240" />
              <line x1="80" y1="0" x2="80" y2="320" />
              <line x1="240" y1="0" x2="240" y2="320" />
              <line x1="400" y1="0" x2="400" y2="320" />
              <line x1="560" y1="0" x2="560" y2="320" />
            </g>
            <g id="heart-line-group" aria-hidden="true"></g>
          </svg>
          <div class="monitor-footer">
            <strong>72 <small>BPM</small></strong>
            <span>RESTING / NORMAL</span>
          </div>
        </aside>
      </section>

      <section
        id="capabilities"
        class="section"
        aria-labelledby="capabilities-title"
      >
        <p class="terminal-label">01 / CAPABILITY_MATRIX</p>
        <h2 id="capabilities-title">역량</h2>
        <div id="capability-list" class="capability-grid"></div>
      </section>

      <section
        id="tech-stack"
        class="section section-muted"
        aria-labelledby="tech-title"
      >
        <p class="terminal-label">02 / TECH_STACK</p>
        <h2 id="tech-title">기술 스택</h2>
        <div id="tech-groups" class="tech-grid"></div>
      </section>

      <section id="projects" class="section" aria-labelledby="projects-title">
        <p class="terminal-label">03 / SELECTED_WORK</p>
        <h2 id="projects-title">프로젝트.</h2>
        <div id="project-list" class="project-grid"></div>
      </section>

      <section
        id="career"
        class="section section-muted"
        aria-labelledby="career-title"
      >
        <p class="terminal-label">04 / DEPLOYMENT_HISTORY</p>
        <h2 id="career-title">2008년부터 쌓아온 경험.</h2>
        <div id="career-list" class="career-list"></div>
      </section>
    </main>

    <footer class="site-footer">
      $ end_of_profile · @bbattery · SEOUL, KOREA
    </footer>

    <script type="module" src="./script.js"></script>
  </body>
</html>
